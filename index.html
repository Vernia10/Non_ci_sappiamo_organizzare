<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>non_ci_sappiamo_organizzare</title>
</head>
<body>

    <!-- Bottone per il login tramite Google -->
    <button id="login-btn">Accedi con Google</button>

    <!-- Script Firebase -->
    <script type="module">
        // Importa le funzioni necessarie da Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // La configurazione di Firebase per il tuo progetto
        const firebaseConfig = {
            apiKey: "AIzaSyD8wo_xQ3_nb2EKpXSm775skjhzYYeVCms",
            authDomain: "non-ci-sappiamo-organizzare.firebaseapp.com",
            projectId: "non-ci-sappiamo-organizzare",
            storageBucket: "non-ci-sappiamo-organizzare.firebasestorage.app",
            messagingSenderId: "994257864018",
            appId: "1:994257864018:web:deff50a9f6a7fed705668b"
        };

        // Inizializza Firebase
        const app = initializeApp(firebaseConfig);

        // Crea un oggetto per l'autenticazione
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Funzione per il login con Google
        function login() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // L'utente è stato autenticato
                    const user = result.user;
                    console.log("Utente autenticato:", user);
                    alert(`Benvenuto, ${user.displayName}!`);
                    // Qui puoi fare qualcosa con l'utente autenticato (es. salvare i suoi dati)
                })
                .catch((error) => {
                    console.error("Errore durante il login:", error.message);
                    alert("Errore nel login. Riprova.");
                });
        }

        // Aggiungi un listener al bottone per il login
        document.getElementById('login-btn').addEventListener('click', login);
    </script>

</body>
</html>
