<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login con Google</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>Accedi con Google</h1>
  <button onclick="loginWithGoogle()">Login</button>
  <p id="user-info"></p>

  <script>
    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD8wo_xQ3_nb2EKpXSm775skjhzYYeVCms",
      authDomain: "non-ci-sappiamo-organizzare.firebaseapp.com",
      projectId: "non-ci-sappiamo-organizzare",
      storageBucket: "non-ci-sappiamo-organizzare.firebasestorage.app",
      messagingSenderId: "994257864018",
      appId: "1:994257864018:web:2a8ea6627af611a705668b"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Funzione di login con Google
    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          document.getElementById("user-info").innerText = `Ciao, ${user.displayName} (${user.email})`;
        })
        .catch(error => {
          console.error("Errore login:", error);
          alert("Errore durante l'accesso: " + error.message);
        });
    }
  </script>
</body>
</html>
