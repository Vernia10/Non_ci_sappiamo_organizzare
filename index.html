<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Non Ci Sappiamo Organizzare</title>
  
  <!-- Carica Firebase SDK -->
  <script type="module">
    // Importa le funzioni necessarie dagli SDK di Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // Configurazione della tua app Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD8wo_xQ3_nb2EKpXSm775skjhzYYeVCms",
      authDomain: "non-ci-sappiamo-organizzare.firebaseapp.com",
      projectId: "non-ci-sappiamo-organizzare",
      storageBucket: "non-ci-sappiamo-organizzare.firebasestorage.app",
      messagingSenderId: "994257864018",
      appId: "1:994257864018:web:2a8ea6627af611a705668b"
    };

    // Inizializza Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    // Riferimenti agli elementi del DOM
    const loginButton = document.getElementById('loginButton');
    const userInfo = document.getElementById('userInfo');
    const userName = document.getElementById('userName');
    const logoutButton = document.getElementById('logoutButton');

    // Funzione per il login con Google
    loginButton.addEventListener('click', () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          // Mostra le informazioni dell'utente
          userName.textContent = user.displayName;
          userInfo.style.display = 'block';
        })
        .catch((error) => {
          console.error("Errore durante il login:", error);
        });
    });

    // Funzione per il logout
    logoutButton.addEventListener('click', () => {
      signOut(auth).then(() => {
        userInfo.style.display = 'none';
        alert("Sei stato disconnesso!");
      }).catch((error) => {
        console.error("Errore durante il logout:", error);
      });
    });
  </script>

  <style>
    /* Stili di base */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }
    .container {
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #357ae8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Benvenuto su Non Ci Sappiamo Organizzare</h1>
    <p>Accedi con il tuo account Google per continuare.</p>
    
    <!-- Pulsante per login -->
    <button id="loginButton">Accedi con Google</button>
    
    <div id="userInfo" style="display:none;">
      <h2>Benvenuto, <span id="userName"></span></h2>
      <button id="logoutButton">Esci</button>
    </div>
  </div>

</body>
</html>
